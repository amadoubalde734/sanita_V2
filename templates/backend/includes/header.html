{% load static %}
<header id="page-topbar">
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <!-- LOGO -->
                <div class="navbar-brand-box horizontal-logo">
                    <a href="{% url 'dashboard:index' %}" class="logo logo-dark">
                        <span class="logo-sm">
                            <img src="{% static 'backend/assets/images/logo_sanita/logo-sm_sanita.png' %}" alt="" height="22">
                        </span>
                        <span class="logo-lg">
                            <img src="{% static 'backend/assets/images/logo-dark_sanita.png' %}" alt="" height="75">
                        </span>
                    </a>

                    <a href="{% url 'dashboard:index' %}" class="logo logo-light">
                        <span class="logo-sm">
                            <img src="{% static 'backend/assets/images/logo_sanita/logo-sm_sanita.png' %}" alt="" height="75">
                        </span>
                        <span class="logo-lg">
                            <img src="{% static 'backend/assets/images/logo-light_sanita.png' %}" alt="" height="70">
                        </span>
                    </a>
                </div>

                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger material-shadow-none" id="topnav-hamburger-icon">
                    <span class="hamburger-icon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>

                <!-- App Search-->
                <form class="app-search d-none d-md-block" action="javascript:void(0);">
                    <div class="position-relative">
                        <input type="text" class="form-control" placeholder="Rechercher un patient, un dossier..." autocomplete="off" id="search-options" value="">
                        <span class="mdi mdi-magnify search-widget-icon"></span>
                        <span class="mdi mdi-close-circle search-widget-icon search-widget-icon-close d-none" id="search-close-options"></span>
                    </div>
                    <div class="dropdown-menu dropdown-menu-lg" id="search-dropdown">
                        <div data-simplebar style="max-height: 200px;">
                            <div class="p-3 text-center text-muted">
                                Commencez à taper pour rechercher
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="d-flex align-items-center">

                <div class="dropdown d-md-none topbar-head-dropdown header-item">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" id="page-header-search-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <i class="bx bx-search fs-22"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0" aria-labelledby="page-header-search-dropdown">
                        <form class="p-3" action="javascript:void(0);">
                            <div class="form-group m-0">
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="Rechercher...">
                                    <button class="btn btn-primary" type="submit"><i class="mdi mdi-magnify"></i></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Language selector -->
                <div class="dropdown ms-1 topbar-head-dropdown header-item">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <img id="header-lang-img" src="{% static 'backend/assets/images/flags/french.svg' %}" alt="Langue" height="20" class="rounded">
                    </button>
                    <div class="dropdown-menu dropdown-menu-end">
                        <a href="javascript:void(0);" class="dropdown-item notify-item language py-2" data-lang="fr" title="Français">
                            <img src="{% static 'backend/assets/images/flags/french.svg' %}" alt="fr" class="me-2 rounded" height="18">
                            <span class="align-middle">Français</span>
                        </a>
                        <a href="javascript:void(0);" class="dropdown-item notify-item language py-2" data-lang="en" title="English">
                            <img src="{% static 'backend/assets/images/flags/us.svg' %}" alt="en" class="me-2 rounded" height="18">
                            <span class="align-middle">English</span>
                        </a>
                        <a href="javascript:void(0);" class="dropdown-item notify-item language py-2" data-lang="es" title="Español">
                            <img src="{% static 'backend/assets/images/flags/spain.svg' %}" alt="es" class="me-2 rounded" height="18">
                            <span class="align-middle">Española</span>
                        </a>
                        <a href="javascript:void(0);" class="dropdown-item notify-item language py-2" data-lang="de" title="Deutsch">
                            <img src="{% static 'backend/assets/images/flags/germany.svg' %}" alt="de" class="me-2 rounded" height="18">
                            <span class="align-middle">Deutsche</span>
                        </a>
                    </div>
                </div>

                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" data-toggle="fullscreen">
                        <i class='bx bx-fullscreen fs-22'></i>
                    </button>
                </div>

                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle light-dark-mode">
                        <i class='bx bx-moon fs-22'></i>
                    </button>
                </div>

                <div class="dropdown topbar-head-dropdown ms-1 header-item" id="notificationDropdown">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" id="page-header-notifications-dropdown" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-haspopup="true" aria-expanded="false">
                        <i class='bx bx-bell fs-22'></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0" aria-labelledby="page-header-notifications-dropdown">
                        <div class="dropdown-head bg-primary bg-pattern rounded-top">
                            <div class="p-3">
                                <h6 class="m-0 fs-16 fw-semibold text-white">Notifications</h6>
                            </div>
                        </div>
                        <div class="p-4 text-center text-muted">
                            <i class="bx bx-bell-off fs-30 mb-2 d-block"></i>
                            Aucune notification pour le moment
                        </div>
                    </div>
                </div>

                <div class="dropdown ms-sm-3 header-item topbar-user">
                    <button type="button" class="btn material-shadow-none" id="page-header-user-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <span class="d-flex align-items-center">
                            <img class="rounded-circle header-profile-user" src="{% static 'backend/assets/images/users/avatar-1.jpg' %}" alt="Avatar">
                            <span class="text-start ms-xl-2">
                                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">{{ user.get_full_name|default:user.username }}</span>
                                <span class="d-none d-xl-block ms-1 fs-12 user-name-sub-text">{{ user.role }}</span>
                            </span>
                        </span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end">
                        <h6 class="dropdown-header">Bienvenue {{ user.get_full_name|default:user.username }} !</h6>
                        <div class="dropdown-divider"></div>
                        <form action="{% url 'accounts:admin_logout' %}" method="post">
                            {% csrf_token %}
                            <button class="dropdown-item" type="submit">
                                <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
                                <span class="align-middle">Déconnexion</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
