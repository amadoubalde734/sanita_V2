{% load static %}
<div class="navbar-brand-box">
    <a href="{% url 'parametrage_general:index' %}" class="logo logo-dark">
        <span class="logo-lg"><strong>Paramétrage Général</strong></span>
    </a>
</div>
<div id="scrollbar">
    <div class="container-fluid">
        <ul class="navbar-nav" id="navbar-nav">

            <li class="nav-item">
                <a class="nav-link{% if request.resolver_match.url_name == 'index' %} active{% endif %}"
                   href="{% url 'parametrage_general:index' %}">
                    <i class="ri-dashboard-3-line"></i> Vue d'ensemble
                </a>
            </li>

            <li class="menu-title"><span>Général</span></li>

            <li class="nav-item">
                <a class="nav-link{% if request.resolver_match.url_name == 'configuration_etablissement' %} active{% endif %}"
                   href="{% url 'parametrage_general:configuration_etablissement' %}">
                    <i class="ri-hospital-line"></i> Établissement
                </a>
            </li>

            {% if config_etablissement.module_prise_en_charge_actif %}
            <li class="menu-title">
                <span>Prise en charge &amp; Entreprises</span>
            </li>

            <li class="nav-item">
                <a class="nav-link{% if request.resolver_match.url_name == 'liste_societes' %} active{% endif %}"
                   href="{% url 'parametrage_general:liste_societes' %}">
                    <i class="ri-building-4-line"></i> Sociétés
                </a>
            </li>
            {% endif %}

            <li class="nav-item">
                <a class="nav-link" href="{% url 'dashboard:index' %}">
                    <i class="ri-arrow-left-line"></i> Retour aux modules
                </a>
            </li>

        </ul>
    </div>
</div>
